<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Demo — Loading…</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #ECE5DD; --hdr: #075E54; --me: #DCF8C6; --bot: #fff; --txt: #111b21; --muted: #667781; }
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", sans-serif; background: #f1f5f9; color: var(--txt); }

/* Layout */
.wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 12px 48px; }
.intro { width: 100%; max-width: 460px; text-align: center; margin-bottom: 16px; }
.intro h1 { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
.intro p { font-size: 13px; color: #64748b; }
.tag { display: inline-block; padding: 3px 10px; border-radius: 10px; background: #eef2ff; color: #4338ca; font-size: 11px; font-weight: 700; margin-bottom: 8px; letter-spacing: 0.4px; text-transform: uppercase; }

/* Phone mockup */
.phone { width: 100%; max-width: 460px; height: 80vh; min-height: 560px; max-height: 800px; background: var(--bg); border-radius: 24px; box-shadow: 0 12px 36px rgba(15,23,42,.18); overflow: hidden; display: flex; flex-direction: column; border: 1.5px solid #d1d5db; }

/* Header */
.hdr { background: var(--hdr); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: #128c7e; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; }
.hdr-text { flex: 1; }
.hdr-name { font-size: 15px; font-weight: 700; }
.hdr-status { font-size: 11px; opacity: 0.8; }
.hdr-icons { font-size: 18px; opacity: 0.85; }

/* Chat area */
.chat { flex: 1; padding: 14px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; background-image: linear-gradient(rgba(236,229,221,.92), rgba(236,229,221,.92)); }
.bubble { max-width: 82%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-wrap: break-word; box-shadow: 0 1px 0.5px rgba(0,0,0,.08); position: relative; }
.bubble.bot { background: var(--bot); border-top-left-radius: 0; align-self: flex-start; }
.bubble.me  { background: var(--me); border-top-right-radius: 0; align-self: flex-end; }
.bubble .ts { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; text-align: right; }
.bubble.bot::before, .bubble.me::after {
  content: ''; position: absolute; top: 0; width: 0; height: 0; border-style: solid;
}
.bubble.bot::before { left: -7px; border-width: 0 7px 7px 0; border-color: transparent var(--bot) transparent transparent; }
.bubble.me::after { right: -7px; border-width: 0 0 7px 7px; border-color: transparent transparent var(--me) transparent; }

.typing { font-size: 12px; color: var(--muted); padding: 4px 12px; display: none; align-self: flex-start; }
.typing.on { display: block; }
.typing-dot { display: inline-block; animation: blink 1.4s infinite both; }
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

/* Input bar */
.inputbar { background: #f0f0f0; padding: 8px 10px; display: flex; gap: 8px; align-items: center; flex-shrink: 0; border-top: 1px solid #d1d5db; }
.inputbar input { flex: 1; padding: 10px 14px; border-radius: 22px; border: none; outline: none; font-size: 14px; background: #fff; font-family: inherit; }
.inputbar button { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--hdr); color: #fff; font-size: 18px; cursor: pointer; flex-shrink: 0; transition: background 0.15s; }
.inputbar button:hover:not(:disabled) { background: #054d44; }
.inputbar button:disabled { background: #94a3b8; cursor: default; }

/* CTA below chat */
.cta { width: 100%; max-width: 460px; margin-top: 18px; padding: 16px; background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); border-radius: 14px; color: white; text-align: center; }
.cta-line1 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.cta-line2 { font-size: 12px; opacity: 0.85; margin-bottom: 12px; }
.cta-btn { display: inline-block; padding: 10px 22px; border-radius: 10px; background: #25D366; color: white; font-weight: 800; font-size: 14px; text-decoration: none; transition: background 0.15s; }
.cta-btn:hover { background: #1da851; }

.error { color: #b91c1c; background: #fef2f2; border: 1.5px solid #fecaca; padding: 12px; border-radius: 8px; font-size: 13px; max-width: 460px; margin-top: 16px; }

footer { font-size: 11px; color: #94a3b8; margin-top: 20px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="intro">
    <span class="tag">🤖 Live AI Demo</span>
    <h1 id="biz-name">Loading…</h1>
    <p>Try it yourself — type any question below ↓</p>
  </div>

  <div class="phone">
    <div class="hdr">
      <div class="avatar" id="avatar">··</div>
      <div class="hdr-text">
        <div class="hdr-name" id="hdr-name">…</div>
        <div class="hdr-status">online · powered by AI</div>
      </div>
      <div class="hdr-icons">📞</div>
    </div>
    <div class="chat" id="chat">
      <div class="typing" id="typing"><span class="typing-dot">●</span> <span class="typing-dot">●</span> <span class="typing-dot">●</span></div>
    </div>
    <div class="inputbar">
      <input id="msg" type="text" placeholder="Type a message…" autocomplete="off" disabled>
      <button id="send" disabled>➤</button>
    </div>
  </div>

  <div class="cta">
    <div class="cta-line1">💡 Like what you see?</div>
    <div class="cta-line2">Get this exact AI for your business — let's talk.</div>
    <a class="cta-btn" id="cta-btn" href="#" target="_blank">📞 Talk to Benjamin</a>
  </div>

  <footer>Demo limited to 20 messages · Powered by AI Agency</footer>
</div>

<script>
const CLIENT_ID = window.location.pathname.split('/').pop();
const MAX_MESSAGES = 20;
let history = [];
let sentCount = 0;
let busy = false;

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('msg');
const sendBtn = document.getElementById('send');
const typingEl = document.getElementById('typing');

function timeNow() {
  return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
}

function renderMsg(role, text) {
  const b = document.createElement('div');
  b.className = 'bubble ' + (role === 'me' ? 'me' : 'bot');
  b.innerHTML = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
  const ts = document.createElement('span');
  ts.className = 'ts';
  ts.textContent = timeNow();
  b.appendChild(ts);
  chatEl.insertBefore(b, typingEl);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function setTyping(on) {
  typingEl.classList.toggle('on', on);
  if (on) chatEl.scrollTop = chatEl.scrollHeight;
}

async function loadConfig() {
  try {
    const res = await fetch(`/api/demo/${CLIENT_ID}/config`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const cfg = await res.json();
    if (!cfg.ok) throw new Error(cfg.error || 'config not ready');

    document.title = `${cfg.businessName} — AI Demo`;
    document.getElementById('biz-name').textContent = `${cfg.businessName} AI Assistant`;
    document.getElementById('hdr-name').textContent = cfg.businessName;
    document.getElementById('avatar').textContent = (cfg.businessName || '?').slice(0, 2).toUpperCase();
    document.getElementById('cta-btn').href = `https://wa.me/${cfg.benjaminWa}?text=${encodeURIComponent(`Hi Benjamin, I just tried the ${cfg.businessName} AI demo and want to learn more.`)}`;

    // Show opening message
    setTyping(true);
    setTimeout(() => {
      setTyping(false);
      renderMsg('bot', cfg.openingMsg);
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }, 800);
  } catch (e) {
    chatEl.innerHTML = `<div class="error">Demo not ready yet: ${e.message}</div>`;
  }
}

async function send() {
  if (busy) return;
  const text = inputEl.value.trim();
  if (!text) return;
  if (sentCount >= MAX_MESSAGES) {
    renderMsg('bot', '🛑 Demo limit reached. Click "Talk to Benjamin" to continue!');
    return;
  }
  busy = true;
  sendBtn.disabled = true;
  inputEl.disabled = true;
  inputEl.value = '';

  renderMsg('me', text);
  history.push({ role: 'user', content: text });
  sentCount++;

  setTyping(true);
  try {
    const res = await fetch(`/api/demo/${CLIENT_ID}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ history })
    });
    const json = await res.json();
    setTyping(false);
    if (!json.ok) throw new Error(json.error || 'something went wrong');
    renderMsg('bot', json.reply);
    history.push({ role: 'assistant', content: json.reply });
  } catch (e) {
    setTyping(false);
    renderMsg('bot', `⚠️ Error: ${e.message}`);
  }
  busy = false;
  sendBtn.disabled = false;
  inputEl.disabled = false;
  inputEl.focus();
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

loadConfig();
</script>
</body>
</html>
