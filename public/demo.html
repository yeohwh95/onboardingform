<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Demo — Loading…</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #ECE5DD; --hdr: #075E54; --me: #DCF8C6; --bot: #fff; --txt: #111b21; --muted: #667781; --think-bg: #0f172a; --think-fg: #94a3b8; --think-accent: #38bdf8; }
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: #f1f5f9; color: var(--txt); }

/* Layout: 2-pane on desktop, stacked on mobile */
.shell { max-width: 1200px; margin: 0 auto; padding: 20px 14px 60px; }
.intro { text-align: center; margin-bottom: 18px; }
.intro h1 { font-size: 22px; font-weight: 800; color: #0f172a; }
.intro p { font-size: 13px; color: #64748b; margin-top: 2px; }
.tag { display: inline-block; padding: 3px 10px; border-radius: 10px; background: #eef2ff; color: #4338ca; font-size: 11px; font-weight: 700; margin-bottom: 8px; letter-spacing: 0.4px; text-transform: uppercase; }

.split { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }

/* ──────────── PHONE (left) ──────────── */
.phone { width: 100%; max-width: 460px; height: 78vh; min-height: 560px; max-height: 800px; background: var(--bg); border-radius: 24px; box-shadow: 0 12px 36px rgba(15,23,42,.18); overflow: hidden; display: flex; flex-direction: column; border: 1.5px solid #d1d5db; margin: 0 auto; }
.hdr { background: var(--hdr); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: #128c7e; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; }
.hdr-text { flex: 1; }
.hdr-name { font-size: 15px; font-weight: 700; }
.hdr-status { font-size: 11px; opacity: 0.8; }
.hdr-icons { font-size: 18px; opacity: 0.85; }

.chat { flex: 1; padding: 14px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; background-image: linear-gradient(rgba(236,229,221,.92), rgba(236,229,221,.92)); }
.bubble { max-width: 82%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-wrap: break-word; box-shadow: 0 1px 0.5px rgba(0,0,0,.08); position: relative; animation: bubbleIn 0.25s ease-out; }
@keyframes bubbleIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.bubble.bot { background: var(--bot); border-top-left-radius: 0; align-self: flex-start; }
.bubble.me  { background: var(--me); border-top-right-radius: 0; align-self: flex-end; }
.bubble + .bubble.bot { margin-top: 2px; border-top-left-radius: 8px; }
.bubble + .bubble.me  { margin-top: 2px; border-top-right-radius: 8px; }
.bubble .ts { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; text-align: right; }
.bubble.bot::before, .bubble.me::after { content: ''; position: absolute; top: 0; width: 0; height: 0; border-style: solid; }
.bubble.bot::before { left: -7px; border-width: 0 7px 7px 0; border-color: transparent var(--bot) transparent transparent; }
.bubble.me::after  { right: -7px; border-width: 0 0 7px 7px; border-color: transparent transparent var(--me) transparent; }

.typing { font-size: 12px; color: var(--muted); padding: 4px 12px; align-self: flex-start; display: none; }
.typing.on { display: block; }
.typing-dot { display: inline-block; animation: blink 1.4s infinite both; }
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

.inputbar { background: #f0f0f0; padding: 8px 10px; display: flex; gap: 8px; align-items: center; flex-shrink: 0; border-top: 1px solid #d1d5db; }
.inputbar input { flex: 1; padding: 10px 14px; border-radius: 22px; border: none; outline: none; font-size: 14px; background: #fff; font-family: inherit; }
.inputbar button { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--hdr); color: #fff; font-size: 18px; cursor: pointer; flex-shrink: 0; transition: background 0.15s; }
.inputbar button:hover:not(:disabled) { background: #054d44; }
.inputbar button:disabled { background: #94a3b8; cursor: default; }

/* ──────────── THINKING SIDEBAR (right) ──────────── */
.brain { width: 100%; max-width: 460px; height: 78vh; min-height: 560px; max-height: 800px; background: var(--think-bg); color: var(--think-fg); border-radius: 24px; box-shadow: 0 12px 36px rgba(15,23,42,.18); overflow: hidden; display: flex; flex-direction: column; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; line-height: 1.55; margin: 0 auto; }
.brain-hdr { padding: 14px 18px; background: #1e293b; color: #fff; display: flex; align-items: center; gap: 10px; flex-shrink: 0; border-bottom: 1px solid #334155; font-family: -apple-system, sans-serif; }
.brain-hdr-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.brain-hdr-title { font-size: 13px; font-weight: 700; letter-spacing: 0.3px; }
.brain-hdr-sub { font-size: 11px; opacity: 0.6; margin-left: auto; font-family: "SF Mono", monospace; }

.brain-body { flex: 1; padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.brain-line { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-bottom: 1px dashed #1e293b; animation: lineIn 0.3s ease-out; }
@keyframes lineIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
.brain-time { color: #475569; flex-shrink: 0; font-size: 10px; min-width: 56px; padding-top: 1px; }
.brain-text { color: var(--think-fg); flex: 1; word-wrap: break-word; }
.brain-text.accent { color: var(--think-accent); }
.brain-text.warn   { color: #fbbf24; }
.brain-text.success { color: #4ade80; }
.brain-text.event  { color: #f472b6; font-weight: 600; }
.brain-divider { color: #1e293b; padding: 4px 0; font-size: 10px; text-align: center; letter-spacing: 1.5px; }

/* ──────────── BELOW SPLIT ──────────── */
.cta { max-width: 940px; margin: 24px auto 0; padding: 18px; background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); border-radius: 14px; color: white; text-align: center; }
.cta-line1 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.cta-line2 { font-size: 12px; opacity: 0.85; margin-bottom: 12px; }
.cta-btn { display: inline-block; padding: 10px 22px; border-radius: 10px; background: #25D366; color: white; font-weight: 800; font-size: 14px; text-decoration: none; transition: background 0.15s; }
.cta-btn:hover { background: #1da851; }

.error { color: #b91c1c; background: #fef2f2; border: 1.5px solid #fecaca; padding: 12px; border-radius: 8px; font-size: 13px; max-width: 460px; margin: 16px auto; }

footer { font-size: 11px; color: #94a3b8; margin-top: 20px; text-align: center; }
</style>
</head>
<body>
<div class="shell">
  <div class="intro">
    <span class="tag">🤖 LIVE AI DEMO</span>
    <h1 id="biz-name">Loading…</h1>
    <p>Try it yourself — type any question · See AI think on the right ↓</p>
  </div>

  <div class="split">
    <!-- LEFT: Phone -->
    <div class="phone">
      <div class="hdr">
        <div class="avatar" id="avatar">··</div>
        <div class="hdr-text">
          <div class="hdr-name" id="hdr-name">…</div>
          <div class="hdr-status">online · powered by AI</div>
        </div>
        <div class="hdr-icons">📞</div>
      </div>
      <div class="chat" id="chat">
        <div class="typing" id="typing"><span class="typing-dot">●</span> <span class="typing-dot">●</span> <span class="typing-dot">●</span></div>
      </div>
      <div class="inputbar">
        <input id="msg" type="text" placeholder="Type a message…" autocomplete="off" disabled>
        <button id="send" disabled>➤</button>
      </div>
    </div>

    <!-- RIGHT: Brain -->
    <div class="brain">
      <div class="brain-hdr">
        <div class="brain-hdr-dot"></div>
        <div class="brain-hdr-title">🧠 AI Thinking</div>
        <div class="brain-hdr-sub" id="session-id">init...</div>
      </div>
      <div class="brain-body" id="brain"></div>
    </div>
  </div>

  <div class="cta">
    <div class="cta-line1">💡 Like what you see?</div>
    <div class="cta-line2">Get this exact AI for your business — let's talk.</div>
    <a class="cta-btn" id="cta-btn" href="#" target="_blank">📞 Talk to Benjamin</a>
  </div>

  <footer>Demo limited to 20 messages · Powered by AI Agency</footer>
</div>

<script>
// ─── State ─────────────────────────────────────────────
const CLIENT_ID = window.location.pathname.split('/').pop();
const SESSION_ID = 's-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const MAX_MESSAGES = 20;
const MERGE_DELAY_MS = 4000;     // wait this long after last user msg before sending to AI
const TYPING_PER_CHAR_MS = 28;   // realism: ~28 ms per char while AI "types"
const BUBBLE_GAP_MS = 350;        // pause between consecutive bubbles
const TYPING_MIN_MS = 600;        // floor for very short bubbles

let history = [];          // turns sent to /chat (alternating user/assistant)
let pendingUserMsgs = [];  // messages waiting for merge timer
let mergeTimer = null;
let sentCount = 0;
let busy = false;

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('msg');
const sendBtn = document.getElementById('send');
const typingEl = document.getElementById('typing');
const brainEl = document.getElementById('brain');

// ─── Helpers ────────────────────────────────────────────
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const escapeHtml = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const nowTime = () => new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const nowChat = () => new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });

document.getElementById('session-id').textContent = SESSION_ID.slice(0, 12);

// ─── Brain (thinking sidebar) ───────────────────────────
function brainLine(text, klass = '') {
  const row = document.createElement('div');
  row.className = 'brain-line';
  const ts = document.createElement('div');
  ts.className = 'brain-time';
  ts.textContent = nowTime();
  const tx = document.createElement('div');
  tx.className = 'brain-text ' + klass;
  tx.innerHTML = escapeHtml(text);
  row.appendChild(ts);
  row.appendChild(tx);
  brainEl.appendChild(row);
  brainEl.scrollTop = brainEl.scrollHeight;
}
function brainDivider(text) {
  const d = document.createElement('div');
  d.className = 'brain-divider';
  d.textContent = '─── ' + text + ' ───';
  brainEl.appendChild(d);
  brainEl.scrollTop = brainEl.scrollHeight;
}

// ─── Chat bubbles ───────────────────────────────────────
function renderBubble(role, text) {
  const b = document.createElement('div');
  b.className = 'bubble ' + (role === 'me' ? 'me' : 'bot');
  b.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
  const ts = document.createElement('span');
  ts.className = 'ts';
  ts.textContent = nowChat();
  b.appendChild(ts);
  chatEl.insertBefore(b, typingEl);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function setTyping(on) {
  typingEl.classList.toggle('on', on);
  if (on) chatEl.scrollTop = chatEl.scrollHeight;
}

// ─── Init: load demo config ────────────────────────────
async function loadConfig() {
  brainLine('🌐 Connecting to demo backend...', 'event');
  try {
    const res = await fetch(`/api/demo/${CLIENT_ID}/config`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const cfg = await res.json();
    if (!cfg.ok) throw new Error(cfg.error || 'config not ready');

    document.title = `${cfg.businessName} — AI Demo`;
    document.getElementById('biz-name').textContent = `${cfg.businessName} AI Assistant`;
    document.getElementById('hdr-name').textContent = cfg.businessName;
    document.getElementById('avatar').textContent = (cfg.businessName || '?').slice(0, 2).toUpperCase();
    document.getElementById('cta-btn').href = `https://wa.me/${cfg.benjaminWa}?text=${encodeURIComponent(`Hi Benjamin, I just tried the ${cfg.businessName} AI demo and want to learn more.`)}`;

    brainLine('✓ Loaded business context: ' + cfg.businessName, 'success');
    brainLine('✓ Industry: ' + (cfg.industry || 'general'), 'success');
    brainLine('✓ System prompt loaded', 'success');
    brainLine('🚀 Ready. Sending opening message...', 'event');

    setTyping(true);
    await sleep(1000);
    setTyping(false);
    renderBubble('bot', cfg.openingMsg);
    brainLine('💬 Sent: opening message', 'accent');
    brainDivider('waiting for user');
    history.push({ role: 'assistant', content: cfg.openingMsg });

    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.focus();
  } catch (e) {
    chatEl.innerHTML = `<div class="error">Demo not ready yet: ${escapeHtml(e.message)}</div>`;
    brainLine('❌ Init failed: ' + e.message, 'warn');
  }
}

// ─── User input handling (with merge debounce) ─────────
function onUserSend() {
  if (busy) return;
  const text = inputEl.value.trim();
  if (!text) return;
  if (sentCount >= MAX_MESSAGES) {
    renderBubble('bot', '🛑 Demo limit reached. Click "Talk to Benjamin" to continue!');
    return;
  }
  inputEl.value = '';
  sentCount++;

  renderBubble('me', text);
  pendingUserMsgs.push(text);

  if (pendingUserMsgs.length === 1) {
    brainDivider('user input');
    brainLine(`📨 Received: "${text.slice(0, 40)}${text.length > 40 ? '…' : ''}"`, 'accent');
    brainLine(`⏳ Waiting ${MERGE_DELAY_MS / 1000}s in case more messages...`, '');
  } else {
    brainLine(`📨 Got another: "${text.slice(0, 40)}${text.length > 40 ? '…' : ''}"`, 'accent');
    brainLine(`🔄 Merge timer reset (${pendingUserMsgs.length} msgs queued)`, '');
  }

  if (mergeTimer) clearTimeout(mergeTimer);
  mergeTimer = setTimeout(processMergedMessages, MERGE_DELAY_MS);
}

async function processMergedMessages() {
  if (busy || pendingUserMsgs.length === 0) return;
  busy = true;
  sendBtn.disabled = true;
  inputEl.disabled = true;

  const merged = pendingUserMsgs.join('\n');
  const count = pendingUserMsgs.length;
  pendingUserMsgs = [];

  if (count > 1) {
    brainLine(`🧠 Merging ${count} messages into one query`, 'event');
  } else {
    brainLine('🧠 Processing message...', 'event');
  }

  history.push({ role: 'user', content: merged });

  // Pre-scripted thinking animations (cover server cold start)
  const animationPromise = playPreThinking();

  // Real API call (parallel)
  let response;
  try {
    const r = await fetch(`/api/demo/${CLIENT_ID}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ history, sessionId: SESSION_ID })
    });
    response = await r.json();
  } catch (e) {
    response = { ok: false, error: e.message };
  }

  await animationPromise;

  if (!response.ok) {
    brainLine('❌ Error: ' + (response.error || 'unknown'), 'warn');
    setTyping(false);
    renderBubble('bot', `⚠️ ${response.error || 'something went wrong'}`);
    finishTurn();
    return;
  }

  // Show real GPT thinking
  brainDivider('AI reasoning');
  const realThinking = response.thinking || [];
  for (const step of realThinking) {
    await sleep(280);
    brainLine('• ' + step, 'accent');
  }

  // Render bubbles with typing delays
  brainDivider('drafting reply');
  brainLine(`✍️ ${response.bubbles.length} bubble(s) to send`, 'success');
  const fullReply = response.bubbles.join('\n\n');

  for (let i = 0; i < response.bubbles.length; i++) {
    const bubble = response.bubbles[i];
    setTyping(true);
    const ms = Math.max(TYPING_MIN_MS, bubble.length * TYPING_PER_CHAR_MS);
    await sleep(ms);
    setTyping(false);
    renderBubble('bot', bubble);
    brainLine(`💬 Sent bubble ${i + 1}/${response.bubbles.length}`, 'success');
    if (i < response.bubbles.length - 1) await sleep(BUBBLE_GAP_MS);
  }

  history.push({ role: 'assistant', content: fullReply });
  brainDivider('waiting for user');
  finishTurn();
}

function finishTurn() {
  busy = false;
  sendBtn.disabled = false;
  inputEl.disabled = false;
  inputEl.focus();
}

async function playPreThinking() {
  const steps = [
    { t: 400, msg: '🌍 Detecting language...' },
    { t: 700, msg: '🎯 Identifying intent...' },
    { t: 600, msg: '📋 Checking qualification stage (Q1/Q2/Q3)...' },
    { t: 600, msg: '🔍 Looking up business context...' },
    { t: 500, msg: '✍️ Drafting reply (chat strategy: split bubbles + emoji)...' }
  ];
  for (const s of steps) {
    await sleep(s.t);
    brainLine(s.msg, '');
  }
}

sendBtn.addEventListener('click', onUserSend);
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') onUserSend(); });

loadConfig();
</script>
</body>
</html>
